name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm -w -F @intellispense/database db:generate
      - name: Run lint and typecheck
        run: pnpm -w -r run typecheck
      - name: Build packages
        run: pnpm -w -r run build
      - name: Run unit tests
        run: pnpm -w -r run test || true
      - name: Start docker-compose services for E2E
        run: |
          docker-compose -f docker-compose.dev.yml up -d --remove-orphans
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if docker exec intellispense-postgres-1 pg_isready -U intellispense >/dev/null 2>&1; then
              echo "postgres ready"; break
            fi
            sleep 1
          done
      - name: Run DB migrations (ci)
        env:
          DATABASE_URL: postgresql://intellispense:intellispense_dev_password@localhost:5432/intellispense_dev
        run: pnpm -w -F @intellispense/database db:migrate:deploy
      - name: Build production packages for E2E
        run: pnpm -w -r run build
      - name: Start API and web servers (background)
        env:
          DATABASE_URL: postgresql://intellispense:intellispense_dev_password@postgres:5432/intellispense_dev
        run: |
          pnpm -w -F @intellispense/api start &
          PORT=3001 pnpm -w -F @intellispense/web-next start &
          # wait for servers to boot
          for i in {1..30}; do
            if curl -sS --fail http://localhost:4000/api/health >/dev/null 2>&1 && curl -sS --fail http://localhost:3001/ >/dev/null 2>&1; then
              echo "servers up"; break
            fi
            sleep 1
          done
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright E2E
        run: pnpm e2e
      - name: Upload E2E artifacts
        if: failure() || always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            e2e/logs
            test-results
