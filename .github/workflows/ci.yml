name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pnpm install
      - name: Run lint and typecheck
        run: pnpm -w -r run typecheck
      - name: Build packages
        run: pnpm -w -r run build
      - name: Run unit tests
        run: pnpm -w -r run test || true
