version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: intellispense
      POSTGRES_PASSWORD: intellispense_dev_password
      POSTGRES_DB: intellispense_dev
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

volumes:
  db_data:
