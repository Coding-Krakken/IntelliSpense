version: '3.8'

# Development-only services. Credentials and ports here must not be used for production.
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: intellispense
      POSTGRES_PASSWORD: intellispense_dev_password
      POSTGRES_DB: intellispense_dev
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '${REDIS_PORT:-6379}:6379'

volumes:
  db_data:
