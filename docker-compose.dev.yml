version: '3.8'

# ===================================================================
# DEVELOPMENT-ONLY SERVICES
# ===================================================================
# WARNING: The credentials below are for LOCAL DEVELOPMENT and E2E tests ONLY.
# Do NOT use these credentials in production environments.
# ===================================================================
services:
  postgres:
    image: postgres:15
    environment:
      # DEV-ONLY CREDENTIALS - never use in production
      POSTGRES_USER: intellispense
      POSTGRES_PASSWORD: intellispense_dev_password
      POSTGRES_DB: intellispense_dev
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '${REDIS_PORT:-6379}:6379'

volumes:
  db_data:
